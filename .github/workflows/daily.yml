name: AI Cycle Daily Watch

on:
  schedule:
    # UTC 22:00 = 한국시간 익일 07:00 (미국장 마감 후, 한국장 개장 전)
    - cron: '0 22 * * 0-4'
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      days:
        description: '조회 기간(일)'
        required: false
        default: '1'

permissions:
  contents: write           # 결과 파일 커밋 권한

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install --quiet requests feedparser

      - name: 수집 실행
        env:
          WATCH_EMAIL: ${{ secrets.WATCH_EMAIL }}
        run: |
          python ai_watch.py --days "${{ github.event.inputs.days || 1 }}" || true

      - name: 결과 커밋
        run: |
          git config user.name  "ai-watch-bot"
          git config user.email "actions@github.com"
          git add out/
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "daily brief $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: 경보 요약 출력
        if: always()
        run: |
          LATEST=$(ls -t out/brief_*.md 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            echo "### $(basename $LATEST)" >> $GITHUB_STEP_SUMMARY
            sed -n '/## ⚑ 경보/,/^## /p' "$LATEST" | head -20 >> $GITHUB_STEP_SUMMARY
          fi
